paper_execution_epoch = "paper-v5-stage-integrity"

data_sources = [
  "local:../../data/pmxt_raw",
  "archive:r2v2.pmxt.dev",
  "archive:r2.pmxt.dev",
]

[paths]
raw_data_root = "../../data/btc_short_horizon"
model_root = "../../data/btc_short_horizon/models"
artifact_root = "../../output/btc_short_horizon"

[primary_market]
name = "btc_updown_15m"
slug_prefix = "btc-updown"
window_seconds = 900
collection_mode = "complete"

[collection_only_market]
name = "btc_updown_5m"
slug_prefix = "btc-updown"
window_seconds = 300
collection_mode = "collection_only"

[research]
feature_cadence_ms = 250
model_cadence_ms = 5000
entry_start_seconds = 3
entry_end_seconds = 180
training_snapshot_seconds = 5
max_feature_lookback_seconds = 3600

[stage_policy]
tolerance_seconds = 0.25

[[stage_policy.rules]]
id = "early_3s_to_30s"
start_seconds = 3.0
end_seconds = 30.0
minimum_net_edge = 0.04
minimum_price = 0.20
maximum_price = 0.80
enabled = true

[[stage_policy.rules]]
id = "price_discovery_35s_to_90s"
start_seconds = 35.0
end_seconds = 90.0
minimum_net_edge = 0.035
minimum_price = 0.20
maximum_price = 0.80
enabled = true

[[stage_policy.rules]]
id = "mid_early_95s_to_180s"
start_seconds = 95.0
end_seconds = 180.0
minimum_net_edge = 0.03
minimum_price = 0.20
maximum_price = 0.80
enabled = true

[collection]
flush_size = 50000
flush_interval_seconds = 60.0
shutdown_flush_timeout_seconds = 30.0
max_pending_events = 100000
max_pending_bytes = 67108864
rotation_poll_seconds = 2.0
polymarket_capture_lead_seconds = 90.0
opening_handoff_delay_seconds = 901.0
binance_spot_depth_snapshot_limit = 1000
binance_futures_depth_snapshot_limit = 1000
binance_depth_snapshot_retry_initial_seconds = 0.5
binance_depth_snapshot_retry_max_seconds = 30.0
polymarket_source_timestamp_regression_tolerance_seconds = 1.0
ingest_version = "btc-short-horizon-v15"

[maker]
structure = "single"
max_shares = 5.0
safety_buffer = 0.01
minimum_edge = 0.10
entry_start_seconds = 3.0
entry_end_seconds = 180.0
confirmation_signals = 2
signal_cadence_seconds = 5.0
signal_cadence_tolerance_seconds = 0.25
max_work_seconds = 15.0
stale_after_seconds = 1.0
cancel_probability_drop = 0.03
max_visible_depth_fraction = 0.05
price_level_tick_offsets = [0]
improve_inside_spread = true

[[paper_execution_variants]]
id = "maker_15s"
label = "Maker 15s"
mode = "maker"
maker_work_seconds = 15.0
primary = false
enabled = false
minimum_taker_net_edge = 0.0
slippage_buffer = 0.0
model_uncertainty_buffer = 0.0
opportunity_policy = "shared_maker"
confirmation_policy = "side_only"
confirmation_signals = 2
maximum_edge_decay = 0.0

[[paper_execution_variants]]
id = "immediate_fak"
label = "Immediate FAK"
mode = "immediate_fak"
maker_work_seconds = 0.0
primary = false
enabled = false
minimum_taker_net_edge = 0.03
slippage_buffer = 0.005
model_uncertainty_buffer = 0.03
opportunity_policy = "shared_maker"
confirmation_policy = "side_only"
confirmation_signals = 2
maximum_edge_decay = 0.0

