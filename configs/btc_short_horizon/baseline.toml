trade_execution_size_multiplier = 0.5
same_timestamp_priority = "trade_before_book"
base_latency_ms = 150.0
insert_latency_ms = 50.0
update_latency_ms = 25.0
cancel_latency_ms = 100.0

[[execution_scenarios]]
name = "p99_full_volume_book_first"
formal_grid_component = true
queue_position = true
maker_rebates_enabled = false
trade_execution_size_multiplier = 1.0
same_timestamp_priority = "book_before_trade"
base_latency_ms = 150.0
insert_latency_ms = 50.0
update_latency_ms = 25.0
cancel_latency_ms = 100.0

