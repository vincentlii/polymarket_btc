label = "Independent FAK 1x5s Control"
mode = "immediate_fak"
maker_work_seconds = 0.0
primary = false
enabled = true
minimum_taker_net_edge = 0.03
slippage_buffer = 0.005
model_uncertainty_buffer = 0.03
opportunity_policy = "independent_taker"
confirmation_policy = "side_only"
confirmation_signals = 1
maximum_edge_decay = 0.0

[[paper_execution_variants]]
id = "independent_maker_1x5s_market_end"
label = "Independent Maker 1x5s Market-End Control"
mode = "maker"
maker_work_seconds = 0.0
maker_expiry_policy = "market_end"
primary = false
enabled = true
minimum_taker_net_edge = 0.03
slippage_buffer = 0.005
model_uncertainty_buffer = 0.03
opportunity_policy = "independent_taker"
confirmation_policy = "side_only"
confirmation_signals = 1
maximum_edge_decay = 0.0

[[paper_execution_variants]]
id = "independent_fak_2x5s"
label = "Independent FAK 2x5s Main"
mode = "immediate_fak"
