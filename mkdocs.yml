site_name: prediction-market-backtesting
site_url: https://evan-kolberg.github.io/prediction-market-backtesting/
repo_url: https://github.com/evan-kolberg/prediction-market-backtesting
repo_name: evan-kolberg/prediction-market-backtesting

exclude_docs: |
  superpowers/

theme:
  name: shadcn
  custom_dir: docs_overrides
  show_title: true
  show_stargazers: true
  topbar_sections: false
  pygments_style:
    light: shadcn-light
    dark: github-dark
  icon: heroicons:chart-bar-square

nav:
  - Home: index.md
  - Setup: setup.md
  - Core Framework:
      - Backtests And Runners: backtests.md
      - Sandbox And Live Runners: live.md
      - Data Loading: data-loading.md
      - Data Vendors And Local Mirrors: data-vendors.md
      - Vendor Fetch Sources And Timing: vendor-fetch-sources.md
      - Execution Modeling: execution-modeling.md
      - Plotting: plotting.md
      - Testing: testing.md
  - Advanced / Experiments:
      - Research And Optimizers: research.md
      - Polymarket Account Ledger Replay: account-ledger-replay.md
      - BTC Short-Horizon Architecture: btc-short-horizon-architecture.md
      - BTC Chainlink 60-second TWAP Evidence: btc-chainlink-twap-research.md
      - BTC Model Validation Research: btc-model-validation-research.md
      - BTC Data Durability And Recovery: btc-data-durability-research.md
      - BTC Market-Data Protocol Boundaries: btc-market-data-protocol-research.md
      - BTC Execution And Latency Research: btc-execution-latency-research.md
      - BTC Strategy Profitability Research: btc-strategy-profitability-research.md
      - BTC Stage-Aware Taker Challenger v2: btc-stage-aware-taker-v2.md
      - BTC Stage Challenger Results 2026-08-05: btc-stage-challenger-results-20260805.md
  - Project:
      - Project Status: project-status.md
      - BTC VPS Operations: btc-vps-operations.md
      - BTC Bot Dashboard Research: btc-dashboard-research.md
      - License Notes: license.md

markdown_extensions:
  - tables
  - fenced_code
  - codehilite
  - toc

extra_css:
  - stylesheets/overrides.css
