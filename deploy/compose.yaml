x-runtime-logging: &runtime-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  forward_collector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BTC_CODE_REVISION: "${BTC_CODE_REVISION:?set BTC_CODE_REVISION to the tested release commit}"
    image: polymarket-btc-forward:local
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    tmpfs:
      - /tmp
    command:
      - python
      - scripts/btc_forward_runtime.py
      - --config
      - configs/btc_short_horizon/baseline.toml
      - --rule-epoch
      - "${BTC_RULE_EPOCH:?set BTC_RULE_EPOCH to the verified current market-rule epoch}"
      - --runtime-root
      - /app/output/btc_short_horizon/runtime
      - --paper-model-directory
      - "${BTC_MODEL_DIRECTORY:?set BTC_MODEL_DIRECTORY to a validated model artifact inside /app/data}"
      - --paper-starting-balance
      - "${BTC_PAPER_STARTING_BALANCE:-1000}"
      - --binance-stream
      - btcusdt@kline_1s
      - --binance-stream
      - btcusdt@depth@100ms
    environment:
      PYTHONUNBUFFERED: "1"
      BTC_MARKET_RELATIVE_MODEL_DIRECTORY: "${BTC_MARKET_RELATIVE_MODEL_DIRECTORY:-}"
    logging: *runtime-logging
    volumes:
      - type: bind
        source: ${BTC_DATA_DIR:-./runtime/data}
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${BTC_OUTPUT_DIR:-./runtime/output}
        target: /app/output
        bind:
          create_host_path: false
    restart: on-failure:5
    stop_signal: SIGINT
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - scripts/btc_runtime_healthcheck.py
        - --config
        - configs/btc_short_horizon/baseline.toml
        - --runtime-root
        - /app/output/btc_short_horizon/runtime
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  dashboard:
    image: polymarket-btc-forward:local
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    depends_on:
      forward_collector:
        condition: service_healthy
    command:
      - python
      - scripts/btc_runtime_dashboard.py
      - --config
      - configs/btc_short_horizon/baseline.toml
      - --runtime-root
      - /app/output/btc_short_horizon/runtime
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    environment:
      PYTHONUNBUFFERED: "1"
    logging: *runtime-logging
    volumes:
      - type: bind
        source: ${BTC_OUTPUT_DIR:-./runtime/output}
        target: /app/output
        read_only: true
        bind:
          create_host_path: false
    ports:
      - ${BTC_DASHBOARD_BIND:-127.0.0.1}:${BTC_DASHBOARD_PORT:-8080}:8080
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  opening_shadow:
    profiles: ["shadow"]
    image: polymarket-btc-forward:local
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    tmpfs:
      - /tmp
    depends_on:
      forward_collector:
        condition: service_healthy
    command:
      - python
      - scripts/btc_opening_shadow_scheduler.py
      - --config
      - configs/btc_short_horizon/baseline.toml
      - --model-directory
      - "${BTC_MODEL_DIRECTORY:?set BTC_MODEL_DIRECTORY to a validated model artifact inside /app/data}"
      - --runtime-root
      - /app/output/btc_short_horizon/runtime
    environment:
      PYTHONUNBUFFERED: "1"
    logging: *runtime-logging
    volumes:
      - type: bind
        source: ${BTC_DATA_DIR:-./runtime/data}
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BTC_OUTPUT_DIR:-./runtime/output}
        target: /app/output
        bind:
          create_host_path: false
    restart: on-failure:5
    stop_signal: SIGINT
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - scripts/btc_runtime_healthcheck.py
        - --runtime-root
        - /app/output/btc_short_horizon/runtime
        - --service
        - opening_shadow
        - --max-age-seconds
        - "90"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
