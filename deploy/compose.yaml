x-runtime-logging: &runtime-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  forward_collector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BTC_CODE_REVISION: "${BTC_CODE_REVISION:?set BTC_CODE_REVISION to the tested release commit}"
    image: polymarket-btc-forward:local
    init: true
    command:
      - python
      - scripts/btc_forward_runtime.py
      - --config
      - configs/btc_short_horizon/baseline.toml
      - --rule-epoch
      - "${BTC_RULE_EPOCH:?set BTC_RULE_EPOCH to the verified current market-rule epoch}"
      - --runtime-root
      - /app/output/btc_short_horizon/runtime
    environment:
      PYTHONUNBUFFERED: "1"
      BTC_CODE_REVISION: "${BTC_CODE_REVISION}"
    logging: *runtime-logging
    volumes:
      - ${BTC_DATA_DIR:-./runtime/data}:/app/data
      - ${BTC_OUTPUT_DIR:-./runtime/output}:/app/output
    restart: on-failure:5
    stop_signal: SIGINT
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - scripts/btc_runtime_healthcheck.py
        - --config
        - configs/btc_short_horizon/baseline.toml
        - --runtime-root
        - /app/output/btc_short_horizon/runtime
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  dashboard:
    image: polymarket-btc-forward:local
    init: true
    command:
      - python
      - scripts/btc_runtime_dashboard.py
      - --config
      - configs/btc_short_horizon/baseline.toml
      - --runtime-root
      - /app/output/btc_short_horizon/runtime
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    environment:
      PYTHONUNBUFFERED: "1"
      BTC_CODE_REVISION: "${BTC_CODE_REVISION}"
    logging: *runtime-logging
    volumes:
      - ${BTC_OUTPUT_DIR:-./runtime/output}:/app/output:ro
    ports:
      - ${BTC_DASHBOARD_BIND:-127.0.0.1}:${BTC_DASHBOARD_PORT:-8080}:8080
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/status', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  opening_shadow:
    profiles: ["shadow"]
    image: polymarket-btc-forward:local
    init: true
    command:
      - python
      - scripts/btc_opening_shadow_scheduler.py
      - --config
      - configs/btc_short_horizon/baseline.toml
      - --model-directory
      - "${BTC_MODEL_DIRECTORY:?set BTC_MODEL_DIRECTORY to a validated model artifact inside /app/data}"
      - --runtime-root
      - /app/output/btc_short_horizon/runtime
    environment:
      PYTHONUNBUFFERED: "1"
      BTC_CODE_REVISION: "${BTC_CODE_REVISION}"
    logging: *runtime-logging
    volumes:
      - ${BTC_DATA_DIR:-./runtime/data}:/app/data:ro
      - ${BTC_OUTPUT_DIR:-./runtime/output}:/app/output
    restart: on-failure:5
    stop_signal: SIGINT
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - scripts/btc_runtime_healthcheck.py
        - --runtime-root
        - /app/output/btc_short_horizon/runtime
        - --service
        - opening_shadow
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
